<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Адаптация под телефоны. Не удалять -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aliaksandr Skurlou</title>
<!-- Шрифт Inter — ближайший аналог Apple SF Pro. Если не нужен — удалите две строки ниже -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== НАСТРОЙКИ: меняйте цвета и отступ здесь ===== */
:root {
  --gap: 15px;            /* отступ 15px: поля, расстояния между блоками */
  --bg: #120A0C;             /* фон страницы */
  --card: #1F1316;        /* фон блоков */
  --line: rgba(255,227,179,.1); /* тонкие границы */
  --text: #FFE3B3;        /* основной текст (кремовый) */
  --muted: #B9A389;      /* второстепенный текст */
  --accent: #FF6766;      /* цвет кнопок */
  --peach: #FFB173;       /* цвет заголовков */
  --crimson: #CA2851;     /* тёмно-малиновый (пятна под стеклом) */
  --radius: 27px;         /* скругление блоков */
  /* Шрифт: системный Apple → Inter → запасные */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 110px; } /* чтобы шапка не закрывала заголовок при переходе */
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ===== ПАРАЛАКС ФОН ===== */
.parallax-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  will-change: transform;
}
.parallax-bg::before {
  content: "";
  position: absolute;
  inset: -10%;
  background:
    radial-gradient(circle at 15% 20%, rgba(202,40,81,.35), transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(255,177,115,.25), transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(255,103,102,.12), transparent 60%);
  filter: blur(60px);
  animation: floatBg 18s ease-in-out infinite alternate;
}
.parallax-bg::after {
  content: "";
  position: absolute;
  inset: -10%;
  background:
    radial-gradient(circle at 70% 15%, rgba(255,177,115,.18), transparent 40%),
    radial-gradient(circle at 20% 85%, rgba(202,40,81,.22), transparent 45%);
  filter: blur(80px);
  animation: floatBg2 22s ease-in-out infinite alternate;
}
@keyframes floatBg {
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-3%, 2%) scale(1.08); }
}
@keyframes floatBg2 {
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(3%, -2%) scale(1.06); }
}

/* ===== ШАПКА (фиксированная) ===== */
.head {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  background: rgba(18,10,12,.72);
  backdrop-filter: saturate(180%) blur(20px);   /* стеклянный эффект как у Apple */
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
}
.head-in {
  max-width: 980px; margin: 0 auto; padding: var(--gap);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap);
}
.logo { font-weight: 600; color: var(--text); text-decoration: none; margin-right: auto; }

/* Навигация */
.nav { display: flex; gap: var(--gap); }
.nav a { color: var(--muted); text-decoration: none; font-size: 14px; transition: color .2s; }
.nav a:hover { color: var(--text); }

/* Переключатель языков */
.lang { display: flex; background: var(--card); border-radius: 999px; padding: 3px; }
.lang button {
  font: inherit; font-size: 12px; font-weight: 600; color: var(--muted);
  background: none; border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer;
}
.lang button.on { background: var(--accent); color: #1a0d10; } /* активный язык */

/* На телефоне навигация переходит на вторую строку */
@media (max-width: 600px) { .nav { order: 3; width: 100%; justify-content: space-between; } }

/* ===== СОДЕРЖИМОЕ ===== */
main { max-width: 980px; margin: 0 auto; padding: 100px var(--gap) var(--gap); position: relative; z-index: 1; } /* 100px сверху = место под шапку */
@media (max-width: 600px) { main { padding-top: 115px; } }

/* Блок (карточка). Их три: #about, #path, #skills */
.block {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: calc(var(--gap) * 2);  /* внутренний отступ = 30px; поставьте var(--gap), если нужно ровно 15px */
  margin: 10px 0;  /* 10px сверху и снизу */
}
.block h2 { color: var(--peach); font-size: clamp(28px, 6vw, 48px); line-height: 1.1; letter-spacing: -.02em; margin-bottom: var(--gap); }
.block p { color: var(--muted); font-size: clamp(16px, 2.4vw, 19px); max-width: 620px; }

/* Кнопки под текстом */
.btns { display: flex; flex-wrap: wrap; gap: var(--gap); margin-top: calc(var(--gap) * 1.5); }
.btn {
  display: inline-block; text-decoration: none; font-size: 15px; font-weight: 500;
  padding: 10px 20px; border-radius: 999px; transition: opacity .2s;
}
.btn:hover { opacity: .8; }
.btn.main { background: var(--accent); color: #0b0b0c; }          /* главная кнопка */
.btn.alt { background: var(--card); color: var(--text); border: 1px solid var(--text); padding: 9px 19px; }          /* второстепенная */

/* ===== БЛОК «СОФТ»: стекло Liquid Glass ===== */
.soft { position: relative; overflow: hidden; }
/* Цветные пятна за стеклом, без них стекло не видно. Меняйте цвета в rgba */
.soft::before {
  content: ""; position: absolute; inset: 0; z-index: 0; filter: blur(30px);
  background: radial-gradient(circle at 15% 70%, rgba(202,40,81,.5), transparent 40%),
              radial-gradient(circle at 85% 30%, rgba(255,177,115,.4), transparent 45%);
}
.soft > * { position: relative; z-index: 1; }
.apps { display: flex; flex-wrap: wrap; gap: var(--gap); margin-top: calc(var(--gap) * 1.5); }
.app { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
/* Круглая стеклянная плашка: размер меняется в width/height */
.glass {
  width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(145deg, rgba(255,255,255,.22), rgba(255,255,255,.05));
  border: 1px solid rgba(255,255,255,.25);
  backdrop-filter: blur(18px) saturate(180%);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.5), inset 0 -8px 16px rgba(202,40,81,.2), 0 10px 30px rgba(0,0,0,.5);
  transition: transform .25s;
}
.glass:hover { transform: translateY(-3px) scale(1.05); }
.glass svg { width: 44px; height: 44px; } /* размер логотипа внутри */

/* ===== Цифры (блок «Учёба и опыт») ===== */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--gap); margin-top: calc(var(--gap) * 1.5); }
.stat { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: calc(var(--radius) - 8px); padding: var(--gap); }
.stat b { display: block; font-size: clamp(26px, 5vw, 38px); line-height: 1.1; color: var(--peach); }
.stat span { font-size: 14px; color: var(--muted); }

/* Список с точками */
.list { list-style: none; padding: 0; margin-top: calc(var(--gap) * 1.5); display: grid; gap: 10px; max-width: 620px; }
.list li { position: relative; padding-left: 22px; color: var(--muted); font-size: clamp(15px, 2.2vw, 17px); }
.list li::before { content: ""; position: absolute; left: 0; top: .6em; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* Теги-навыки (блок «Навыки») */
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: calc(var(--gap) * 1.5); }
.chip { padding: 8px 16px; border-radius: 999px; font-size: 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line); }

footer { text-align: center; color: var(--muted); font-size: 13px; padding: var(--gap); position: relative; z-index: 1; }
</style>
</head>
<body>

<!-- ===== ПАРАЛАКС ФОН ===== -->
<div class="parallax-bg" id="parallaxBg"></div>

<!-- ===== ШАПКА: логотип, навигация, языки ===== -->
<header class="head">
  <div class="head-in">
    <a class="logo" href="#about">Aliaksandr Skurlou</a> <!-- здесь ваше имя -->
    <nav class="nav">
      <!-- href должен совпадать с id блока ниже; текст берётся из словаря языков -->
      <a href="#about" data-i18n="nav1"></a>
      <a href="#path" data-i18n="nav2"></a>

</header>

<main>
  <!-- ===== БЛОК 1: о себе ===== -->
  <section class="block" id="about">
    <h2 data-i18n="h1"></h2>
    <p data-i18n="t1"></p>
    <div class="btns">
      <!-- Кнопка ведёт на почту с готовой темой письма -->
      <a class="btn main" href="mailto:skynkarpovich@gmail.com?subject=Cooperation%20with%20Aliaksandr%20Skurlou&body=Hello%20Aliaksandr%2C%0A%0A" data-i18n="b1a"></a>
      <a class="btn alt" href="#" data-i18n="b1b"></a>
    </div>
  </section>

  <!-- ===== БЛОК 2: опыт и учёба ===== -->
  <section class="block" id="path">
    <h2 data-i18n="h2"></h2>

    <!-- Три цифры. Меняйте текст в словаре внизу (ключи sn1..sl3) -->

      <li data-i18n="li2"></li>
      <li data-i18n="li3"></li>

    <div class="btns">
      <a class="btn main" href="#" data-i18n="b2a"></a>
      <a class="btn alt" href="#" data-i18n="b2b"></a>
    </div>
  </section>

  <!-- ===== БЛОК 3: навыки ===== -->
  <section class="block" id="skills">
    <h2 data-i18n="h3"></h2>
    <p data-i18n="t3"></p>
    <!-- Теги навыков. Новый тег: скопируйте <span> и добавьте ключ в словарь -->
    <div class="chips">
      <span class="chip" data-i18n="c1"></span>
      <span class="chip" data-i18n="c2"></span>
      <span class="chip" data-i18n="c3"></span>
      <span class="chip" data-i18n="c4"></span>
      <span class="chip" data-i18n="c5"></span>
      <span class="chip" data-i18n="c6"></span>
      <span class="chip" data-i18n="c7"></span>
    </div>
    <div class="btns">
      <a class="btn main" href="#" data-i18n="b3a"></a>
    </div>
  </section>
  <!-- ===== БЛОК 4: программы (софт) ===== -->
  <section class="block soft" id="software">
    <h2 data-i18n="h4"></h2>
    <p data-i18n="t4"></p>

      <!-- Одна программа = один .app. Чтобы добавить ещё, скопируйте целиком <div class="app"> -->
      <!-- Логотип рисован кодом (SVG). Чтобы поставить официальный: замените <svg> на <img src="logo.png" width="44" alt=""> -->
      <div class="app">
        <div class="glass">
          <svg viewBox="0 0 48 48"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c4cc"/><stop offset="1" stop-color="#7d2ae8"/></linearGradient></defs>
            <circle cx="24" cy="24" r="22" fill="url(#cg)"/>
            <path d="M31 17a10 10 0 1 0 0 14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
        </div>
        Canva

      <div class="app">

          <svg viewBox="0 0 48 48"><path d="M10 14l11 8M27 26l11 8M10 34l28-20" stroke="#FFE3B3" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
        </div>
        CapCut
      </div>
      <div class="app">
        <div class="glass">
          <svg viewBox="0 0 38 57"><path d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0z" fill="#1abcfe"/><path d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0z" fill="#0acf83"/><path d="M19 0v19h9.5a9.5 9.5 0 1 0 0-19H19z" fill="#ff7262"/><path d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5z" fill="#f24e1e"/><path d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5z" fill="#a259ff"/></svg>
        </div>
        Figma
      </div>
    </div>
  </section>
</main>

<footer>© 2026 Aliaksandr Skurlou</footer>

<script>
/* ===== ТЕКСТЫ НА ТРЁХ ЯЗЫКАХ =====
   Ключ (h1, t1...) совпадает с data-i18n в HTML.
   Меняйте только текст справа. Новый текст: добавьте ключ во все три языка. */
const T = {
  ru: {
    nav1: "Обо мне", nav2: "Путь", nav3: "Навыки",
    h1: "Привет, я Александр", t1: "IT-студент из Польши. Увлекаюсь Linux, разработкой и созданием контента. Ищу первые проекты и практику.",
    b1a: "Написать мне", b1b: "Скачать резюме",
    h2: "Учёба и опыт", t2: "Учусь на IT в техникуме в Рыках, есть сертификат INF.03. Два года проработал в отделе маркетинга.",
    b2a: "Мой путь", b2b: "Сертификаты",
    h3: "Навыки", t3: "Видео, трафик и аналитика, а также основы веб-разработки и Linux.",
    b3a: "Проекты",
    nav4: "Софт", h4: "Программы", t4: "Программы, в которых я умею работать.",
    sn1: "2 года", sl1: "в отделе маркетинга",
    sn2: "~20", sl2: "аккаунтов под трафик",
    sn3: "1 млн", sl3: "просмотров в Instagram",
    li1: "Создавал видеоконтент и общался с клиентами",
    li2: "Вёл около 20 аккаунтов для трафика",
    li3: "Делал видео с помощью ИИ, одно из них набрало 1 млн в Instagram",
    li4: "Знаю, из чего состоит хорошее видео, и разбираюсь в аналитике и графиках",
    c1: "Видеомонтаж", c2: "AI-видео", c3: "Трафик-аккаунты", c4: "Аналитика", c5: "Работа с клиентами", c6: "Linux", c7: "HTML и CSS"
  },
  en: {
    nav1: "About", nav2: "Path", nav3: "Skills",
    h1: "Hi, I'm Aliaksandr", t1: "IT student based in Poland. I'm into Linux, development and content creation. Looking for first projects and practice.",
    b1a: "Contact me", b1b: "Download CV",
    h2: "Education & experience", t2: "Studying IT at a technical school in Ryki, with an INF.03 certificate. Spent two years in a marketing department.",
    b2a: "My path", b2b: "Certificates",
    h3: "Skills", t3: "Video, traffic and analytics, plus web development basics and Linux.",
    b3a: "Projects",
    nav4: "Software", h4: "Software skills", t4: "Programs I know how to work in.",
    sn1: "2 years", sl1: "in marketing",
    sn2: "~20", sl2: "traffic accounts",
    sn3: "1M", sl3: "views on Instagram",
    li1: "Created video content and worked with clients",
    li2: "Managed around 20 accounts for traffic",
    li3: "Made AI-generated videos, one of them reached 1M on Instagram",
    li4: "I know what makes a good video and I'm comfortable with analytics and charts",
    c1: "Video editing", c2: "AI video", c3: "Traffic accounts", c4: "Analytics", c5: "Client communication", c6: "Linux", c7: "HTML & CSS"
  },
  pl: {
    nav1: "O mnie", nav2: "Droga", nav3: "Umiejętności",
    h1: "Cześć, jestem Aliaksandr", t1: "Student IT mieszkający w Polsce. Interesuję się Linuksem, programowaniem i tworzeniem treści. Szukam pierwszych projektów i praktyk.",
    b1a: "Napisz do mnie", b1b: "Pobierz CV",
    h2: "Nauka i doświadczenie", t2: "Uczę się informatyki w technikum w Rykach, mam certyfikat INF.03. Dwa lata pracowałem w dziale marketingu.",
    b2a: "Moja droga", b2b: "Certyfikaty",
    h3: "Umiejętności", t3: "Wideo, ruch i analityka oraz podstawy tworzenia stron i Linux.",
    b3a: "Projekty",
    nav4: "Programy", h4: "Programy", t4: "Programy, w których umiem pracować.",
    sn1: "2 lata", sl1: "w marketingu",
    sn2: "~20", sl2: "kont pod ruch",
    sn3: "1 mln", sl3: "wyświetleń na Instagramie",
    li1: "Tworzyłem treści wideo i kontaktowałem się z klientami",
    li2: "Prowadziłem około 20 kont pod ruch",
    li3: "Robiłem wideo z pomocą AI, jedno z nich osiągnęło 1 mln na Instagramie",
    li4: "Wiem, z czego składa się dobry film, i orientuję się w analityce oraz wykresach",
    c1: "Montaż wideo", c2: "Wideo AI", c3: "Konta pod ruch", c4: "Analityka", c5: "Obsługa klientów", c6: "Linux", c7: "HTML i CSS"
  }
};

/* Применяем язык: подставляем тексты и подсвечиваем кнопку */
function setLang(l) {
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T[l][el.dataset.i18n]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === l));
  try { localStorage.setItem("lang", l); } catch (e) {} /* запоминаем выбор */
}

/* Клик по RU / EN / PL */
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));

/* Стартовый язык: сохранённый → язык браузера → русский */
let start = "ru";
try { start = localStorage.getItem("lang") || start; } catch (e) {}
if (!T[start]) start = "ru";
setLang(start);

/* ===== ПАРАЛАКС ЭФФЕКТ ФОНА ===== */
const parallaxBg = document.getElementById("parallaxBg");
let ticking = false;

function updateParallax() {
  const scrolled = window.scrollY;
  /* Медленное смещение фона — создаёт эффект глубины */
  parallaxBg.style.transform = `translate3d(0, ${scrolled * 0.35}px, 0)`;
  ticking = false;
}

window.addEventListener("scroll", () => {
  if (!ticking) {
    window.requestAnimationFrame(updateParallax);
    ticking = true;
  }
}, { passive: true });
</script>
</body>
</html>
